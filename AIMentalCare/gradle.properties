# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# Force Gradle to use local JDK 17
org.gradle.java.home=C:/Users/admin/.jdks/jbr-17.0.14

# Extended network timeout settings to prevent SocketTimeoutException
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.http.keepAlive=true

# Enabled parallel sync for Gradle 9.4+
# org.gradle.tooling.parallel=true

android.useAndroidX=true
android.enableJetifier=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

kotlin.daemon.jvmargs=-Djava.awt.headless=true -Xmx2048m
kotlin.compiler.execution.strategy=in-process

