name: mentalcare_ai_flutter
description: "MentalCare AI - Cross-Platform Mental Wellness Application (Android & iOS)"
publish_to: 'none'

version: 2.4.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  fl_chart: ^0.68.0
  url_launcher: ^6.2.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#047857"
  adaptive_icon_foreground: "assets/images/ic_logo.png"
